name: Release

# Push a tag `vX.Y.Z` matching the version in Cargo.toml to publish a GitHub
# release with static Linux binaries and macOS binaries, and the server
# container image ghcr.io/graytonio/muster. On PRs that touch the release
# setup, the binaries and image are built without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
      - container/**
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the crate version and check it matches the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "crate version: $version"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version} (expected v${version})"
              exit 1
            fi
          else
            version="${version}-dev.${GITHUB_SHA::7}"
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  # Releases only ship commits that pass the full CI suite.
  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: [version, ci]
    # `ci` is skipped outside tag pushes; build anyway unless something failed.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
            native: true
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: muster-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin muster --target ${{ matrix.target }}
      - name: Check the binary
        run: |
          bin=target/${{ matrix.target }}/release/muster
          file "$bin"
          if [ "${{ matrix.musl }}" = true ]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          fi
          if [ "${{ matrix.native }}" = true ]; then
            "$bin" --version
          fi
      - name: Package
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp target/${{ matrix.target }}/release/muster "dist/$ARCHIVE/"
          cp docs/RUNTIME.md docs/USAGE.md "dist/$ARCHIVE/"
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "muster $GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"

  # The server image (container/Dockerfile) for linux/amd64 and linux/arm64,
  # built from the static musl binaries above. Pushed on tags only.
  image:
    name: container image
    needs: [version, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/muster
      PUSH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: muster-*-linux-musl
          merge-multiple: true
      - name: Stage the binaries per platform
        run: |
          version=${{ needs.version.outputs.version }}
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*} target=${pair#*:}-unknown-linux-musl
            tar -C dist -xzf "dist/muster-${version}-${target}.tar.gz"
            install -D -m 755 "dist/muster-${version}-${target}/muster" "container/bin/${arch}/muster"
          done
          ls -lR container/bin
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: tags
        name: Image tags
        run: |
          version=${{ needs.version.outputs.version }}
          tags="${IMAGE}:${version}"
          if [ "${{ needs.version.outputs.prerelease }}" = false ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      # Run the real entrypoint (no Tailscale) and check herdr comes up, the
      # config validates and the pod shuts down cleanly on SIGTERM.
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v6
        with:
          context: container
          platforms: linux/amd64
          tags: muster:smoke
          load: true
          cache-from: type=gha
      - name: Smoke test
        run: |
          docker run -d --name smoke -e GH_TOKEN=smoke-token -v "$PWD/defaults:/etc/muster:ro" muster:smoke
          ok=false
          for _ in $(seq 1 60); do
            if docker exec smoke muster-healthcheck; then ok=true; break; fi
            sleep 2
          done
          docker exec -u muster smoke muster validate
          docker exec -u muster smoke sh -c 'herdr --version && claude --version && gh --version && tailscale version && rustup --version && cc --version'
          # The repos dir is trusted for Claude Code (no trust prompt on start).
          docker exec -u muster smoke jq -e '.projects["/var/lib/muster/repos"].hasTrustDialogAccepted == true' /var/lib/muster/home/.claude.json
          # Like a non-interactive SSH command: no GH_TOKEN in the environment.
          # gh and git's credential helper must still find the pod's token.
          test "$(docker exec -u muster smoke env -u GH_TOKEN gh auth token)" = smoke-token
          printf 'protocol=https\nhost=github.com\n\n' \
            | docker exec -i -u muster smoke env -u GH_TOKEN git credential fill \
            | grep -qx 'password=smoke-token'
          docker stop -t 30 smoke
          docker logs smoke
          test "$ok" = true
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0
      - uses: docker/build-push-action@v6
        with:
          context: container
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          push: ${{ env.PUSH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
