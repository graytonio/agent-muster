[package]
name = "muster"
version = "0.1.3"
edition = "2021"
rust-version = "1.89"
description = "Orchestrate multi-agent workflows on a herdr server"

[[bin]]
name = "muster"
path = "src/main.rs"

# Scripted stand-in for the herdr CLI, used only by integration tests.
[[bin]]
name = "fake-herdr"
path = "tests/fake-herdr/fake_herdr.rs"
test = false
doc = false

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
toml = "1.2.3"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
