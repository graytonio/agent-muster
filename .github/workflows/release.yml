name: Release

# Push a tag `vX.Y.Z` matching the version in Cargo.toml to publish a GitHub
# release with static Linux binaries and macOS binaries. On PRs that touch the
# release setup, the build matrix runs without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - rust-toolchain.toml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the crate version and check it matches the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "crate version: $version"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version} (expected v${version})"
              exit 1
            fi
          else
            version="${version}-dev.${GITHUB_SHA::7}"
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  # Releases only ship commits that pass the full CI suite.
  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: [version, ci]
    # `ci` is skipped outside tag pushes; build anyway unless something failed.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            native: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
            native: true
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
    runs-on: ${{ matrix.os }}
    env:
      ARCHIVE: muster-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --bin muster --target ${{ matrix.target }}
      - name: Check the binary
        run: |
          bin=target/${{ matrix.target }}/release/muster
          file "$bin"
          if [ "${{ matrix.musl }}" = true ]; then
            file "$bin" | grep -Eq 'statically linked|static-pie linked'
          fi
          if [ "${{ matrix.native }}" = true ]; then
            "$bin" --version
          fi
      - name: Package
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp target/${{ matrix.target }}/release/muster "dist/$ARCHIVE/"
          cp docs/RUNTIME.md docs/USAGE.md "dist/$ARCHIVE/"
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "muster $GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"
